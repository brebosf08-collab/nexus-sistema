<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus — Recuperação de Acesso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="static/app.css?v=nexus-v2">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.15);
      --bg: #030305;
    }
    body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; overflow-x: hidden; }
    
    .bg-portal { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 50px 50px; mask-image: radial-gradient(circle at 50% 50%, black, transparent 80%); }
    .glow-orb { position: absolute; border-radius: 50%; filter: blur(140px); background: var(--accent); opacity: 0.12; animation: float 15s infinite alternate ease-in-out; }
    
    @keyframes float { 0% { transform: translate(-10%, -10%) scale(1); } 100% { transform: translate(10%, 10%) scale(1.2); } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

    .card-nexus {
      position: relative; z-index: 10; width: 100%; max-width: 450px;
      background: rgba(255, 255, 255, 0.01); border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 40px; padding: 4rem 3rem; backdrop-filter: blur(40px);
      box-shadow: 0 60px 120px -30px rgba(0,0,0,0.9);
      animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .header-portal { text-align: center; margin-bottom: 3.5rem; }
    .icon-box { 
      width: 64px; height: 64px; background: var(--accent-glow); color: var(--accent);
      border-radius: 20px; display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; margin: 0 auto 2rem; border: 1px solid rgba(255,255,255,0.05);
    }
    
    h1 { font-family: 'Space Grotesk', sans-serif; font-size: 2.25rem; font-weight: 800; margin: 0; letter-spacing: -0.04em; line-height: 1.1; }
    .subtitle { color: #808090; font-size: 1rem; margin-top: 1rem; line-height: 1.5; }

    .field { display: flex; flex-direction: column; gap: 10px; margin-bottom: 2rem; }
    label { font-size: 0.7rem; font-weight: 800; color: #606070; text-transform: uppercase; letter-spacing: 0.12em; }
    
    input {
      background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px; height: 58px; padding: 0 1.25rem; color: #fff;
      font-size: 1.05rem; transition: 0.3s;
    }
    input:focus { outline: none; border-color: var(--accent); background: rgba(255, 255, 255, 0.05); box-shadow: 0 0 0 4px var(--accent-glow); }

    .btn-submit {
      width: 100%; height: 62px; border: none; border-radius: 20px;
      background: var(--accent); color: #fff; font-size: 1.1rem; font-weight: 800;
      cursor: pointer; transition: 0.4s; display: flex; align-items: center; justify-content: center; gap: 12px;
    }
    .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 20px 40px -10px var(--accent-glow); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .footer-portal { text-align: center; margin-top: 2.5rem; color: #606070; font-size: 0.9rem; }
    .footer-portal a { color: #fff; font-weight: 700; text-decoration: none; border-bottom: 2px solid var(--accent); transition: 0.3s; }
    .footer-portal a:hover { color: var(--accent); }

    .status-msg {
      display: none; padding: 1.25rem; border-radius: 18px; margin-top: 2rem; font-weight: 600; text-align: center; font-size: 0.95rem;
    }
    .status-msg.error { background: rgba(244, 63, 94, 0.08); border: 1px solid rgba(244, 63, 94, 0.15); color: #f43f5e; }
    .status-msg.success { background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.15); color: #10b981; }
  </style>
</head>
<body>

<div class="bg-portal">
  <div class="bg-grid"></div>
  <div class="glow-orb" style="width: 500px; height: 500px; top: -100px; right: -50px;"></div>
</div>

<div class="card-nexus">
  <div class="header-portal">
    <div class="icon-box">
      <i class="fas fa-key-skeleton"></i>
    </div>
    <h1>Recuperar Chave</h1>
    <p class="subtitle">Enviaremos um link de redefinição para o e-mail cadastrado na rede Nexus.</p>
  </div>

  <form id="formReset">
    <div class="field">
      <label>E-mail de Cadastro</label>
      <input type="email" id="email" placeholder="ex: acesso@empresa.com" required autofocus>
    </div>
    
    <button type="submit" class="btn-submit" id="btnSubmit">
      <span>Enviar Instruções</span>
      <i class="fas fa-paper-plane"></i>
    </button>

    <div id="statusMsg" class="status-msg"></div>
  </form>

  <div class="footer-portal">
    Lembrou sua senha? <a href="login.html">Voltar para o Login</a>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://gtctfqphvsczeenpysco.supabase.co";
  const SUPABASE_KEY = 'REMOVED';
  // Supabase frontend init removed

  document.getElementById('formReset').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnSubmit');
    const msg = document.getElementById('statusMsg');
    const email = document.getElementById('email').value;

    msg.style.display = 'none';
    btn.disabled = true;
    btn.querySelector('span').textContent = 'Processando...';

    try {
      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/nova_senha.html',
      });

      if (error) throw error;

      msg.textContent = "Sucesso! Verifique sua caixa de entrada para redefinir sua senha.";
      msg.className = "status-msg success";
      msg.style.display = "block";
      btn.querySelector('span').textContent = 'Instruções Enviadas';
      
    } catch (ex) {
      msg.textContent = "Erro: " + (ex.message || "Tente novamente mais tarde.");
      msg.className = "status-msg error";
      msg.style.display = "block";
      btn.disabled = false;
      btn.querySelector('span').textContent = 'Enviar Instruções';
    }
  });
</script>

</body>
</html>
