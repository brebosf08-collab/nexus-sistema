<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus — Autenticação Corporativa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="./static/app.css?v=nexus-v2">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.15);
      --bg: #030305;
    }
    body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; overflow-x: hidden; }
    .bg-portal { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 50px 50px; mask-image: radial-gradient(circle at 50% 50%, black, transparent 80%); }
    .glow-orb { position: absolute; border-radius: 50%; filter: blur(140px); background: var(--accent); opacity: 0.12; animation: float 15s infinite alternate ease-in-out; }
    @keyframes float { 0% { transform: translate(-10%, -10%) scale(1); } 100% { transform: translate(10%, 10%) scale(1.2); } }
    .card-nexus { position: relative; z-index: 10; width: 100%; max-width: 480px; background: rgba(255, 255, 255, 0.01); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 40px; padding: 4rem 3rem; backdrop-filter: blur(40px); box-shadow: 0 60px 120px -30px rgba(0,0,0,0.9); animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); }
    .header-portal { text-align: center; margin-bottom: 3.5rem; }
    h1 { font-family: 'Space Grotesk', sans-serif; font-size: 2.25rem; font-weight: 800; margin: 0; letter-spacing: -0.04em; }
    .subtitle { color: #808090; font-size: 1rem; margin-top: 0.75rem; }
    .field { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1.5rem; }
    label { font-size: 0.7rem; font-weight: 800; color: #606070; text-transform: uppercase; letter-spacing: 0.12em; }
    input { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; height: 56px; padding: 0 1.25rem; color: #fff; font-size: 1rem; transition: 0.3s; }
    input:focus { outline: none; border-color: var(--accent); background: rgba(255, 255, 255, 0.05); box-shadow: 0 0 0 4px var(--accent-glow); }
    .input-wrapper { position: relative; display: flex; align-items: center; }
    .input-wrapper input { width: 100%; padding-right: 3.5rem; }
    .btn-toggle { position: absolute; right: 10px; height: 40px; width: 40px; background: transparent; border: none; color: #606070; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; }
    .btn-submit { width: 100%; height: 62px; border: none; border-radius: 20px; background: var(--accent); color: #fff; font-size: 1.1rem; font-weight: 800; cursor: pointer; transition: 0.4s; display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 1rem; }
    .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 20px 40px -10px var(--accent-glow); }
    .footer-portal { text-align: center; margin-top: 2.5rem; color: #606070; font-size: 0.9rem; }
    .footer-portal a { color: #fff; font-weight: 700; text-decoration: none; border-bottom: 2px solid var(--accent); }
    .error-msg { display: none; background: rgba(244, 63, 94, 0.08); border: 1px solid rgba(244, 63, 94, 0.15); color: #f43f5e; padding: 1rem; border-radius: 16px; margin-top: 1.5rem; font-weight: 600; text-align: center; font-size: 0.9rem; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<div class="bg-portal">
  <div class="bg-grid"></div>
  <div class="glow-orb" style="width: 500px; height: 500px; top: -150px; right: -100px;"></div>
</div>

  <div class="card-nexus">
  <div class="header-portal">
    <h1>Entrar Agora</h1>
    <p class="subtitle" id="portalSub">Gestão de Inteligência Nexus</p>
  </div>

  <form id="formLogin" autocomplete="on" novalidate>
    <div class="field">
      <label for="email">E-mail de Acesso</label>
      <input type="email" id="email" name="email" placeholder="nome@empresa.com" required autocomplete="username" autofocus>
    </div>
    <div class="field">
      <label for="senha">Senha</label>
      <div class="input-wrapper">
        <input type="password" id="senha" name="senha" placeholder="••••••••" required autocomplete="current-password">
        <button type="button" class="btn-toggle" id="toggleSenha">
          <i class="fas fa-eye"></i>
        </button>
      </div>
    </div>
    <button type="submit" class="btn-submit" id="btnSubmit">
      <span>Entrar Agora</span>
      <i class="fas fa-chevron-right"></i>
    </button>
    
    <div style="text-align:center; margin-top:1.2rem;">
      <a href="reset_senha.html" style="color:var(--accent);font-weight:700;text-decoration:none;">Esqueci minha senha</a>
    </div>
    <div id="errorMsg" class="error-msg" role="alert"></div>
  </form>
  <div class="footer-portal">
    Ainda não possui credenciais? <a href="cadastro.html">Solicitar Acesso</a>
  </div>
</div>

  <script>
    const API_BASE = window.location.protocol === 'file:' ? 'http://127.0.0.1:8080' : '';

    // Troca de cor e título conforme tipo
    const urlParams = new URLSearchParams(window.location.search);
    const tipo = urlParams.get('tipo') || 'fornecedor';
    if (tipo === 'cliente') {
      document.documentElement.style.setProperty('--accent', '#10b981');
      document.getElementById('portalSub').textContent = 'Portal do Cliente Nexus';
    }

    // Toggle senha
    const senhaInput = document.getElementById('senha');
    const toggleBtn = document.getElementById('toggleSenha');
    toggleBtn.addEventListener('click', () => {
      senhaInput.type = senhaInput.type === 'password' ? 'text' : 'password';
      toggleBtn.querySelector('i').className = senhaInput.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
    });

    // Login handler via API
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      const err = document.getElementById('errorMsg');
      err.style.display = 'none';
      btn.disabled = true;
      btn.querySelector('span').textContent = 'Entrando...';

      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;

      try {
        const res = await fetch(`${API_BASE}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ login: email, senha: senha })
        });

        const result = await res.json();

        if (!res.ok || !result.sucesso) {
          throw new Error(result.mensagem || 'Credenciais inválidas.');
        }

        // Salvar na "Sessão" (localStorage)
        localStorage.setItem('nexus_user', JSON.stringify({
          login: email,
          nome: result.nome || email.split('@')[0],
          empresa_id: result.empresa_id,
          empresa_tipo: result.empresa_tipo || 'fornecedor',
          empresa_nome: result.empresa_nome || 'Minha Empresa'
        }));

        // Redirecionar via link do servidor ou local
        window.location.href = result.redirect || ((result.empresa_tipo || 'fornecedor') + '.html');

      } catch (ex) {
        err.textContent = 'Erro: ' + ex.message;
        err.style.display = 'block';
        btn.disabled = false;
        btn.querySelector('span').textContent = 'Entrar Agora';
      }
    });
    

  </script>

</body>
</html>
