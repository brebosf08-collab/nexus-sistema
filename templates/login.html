<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus Fábrica — Entrar</title>
<style>
  :root{--bg:#0f1117;--card:#171a24;--border:#262a38;--text:#e8e9ee;--muted:#8a8fa3;--accent:#6366f1;--accent2:#818cf8;--danger:#ef4444;--ok:#22c55e}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:36px;width:100%;max-width:400px}
  h1{margin:0 0 4px;font-size:24px}
  p.sub{color:var(--muted);margin:0 0 24px;font-size:14px}
  .tabs{display:flex;background:#0f1117;border-radius:10px;padding:4px;margin-bottom:24px}
  .tab{flex:1;text-align:center;padding:10px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--muted)}
  .tab.active{background:var(--accent);color:#fff}
  label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
  input{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--border);background:#0f1117;color:var(--text);font-size:14px}
  input:focus{outline:none;border-color:var(--accent)}
  button.submit{width:100%;margin-top:22px;padding:12px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  button.submit:hover{background:var(--accent2)}
  .msg{margin-top:14px;padding:10px 12px;border-radius:8px;font-size:13px;display:none}
  .msg.erro{background:#3a1a1a;color:#ff8b8b;display:block}
  .msg.ok{background:#12301c;color:#7ee8a3;display:block}
  .form{display:none}
  .form.active{display:block}
</style>
</head>
<body>
  <div class="card">
    <h1>🏭 Nexus Fábrica</h1>
    <p class="sub">Gestão de produtos, matérias-primas e pedidos</p>

    <div class="tabs">
      <div class="tab active" id="tab-login" onclick="mudarAba('login')">Entrar</div>
      <div class="tab" id="tab-registrar" onclick="mudarAba('registrar')">Criar conta</div>
    </div>

    <form class="form active" id="form-login" onsubmit="fazerLogin(event)">
      <label>E-mail</label>
      <input type="email" id="login-email" required>
      <label>Senha</label>
      <input type="password" id="login-senha" required>
      <button class="submit" type="submit">Entrar</button>
    </form>

    <form class="form" id="form-registrar" onsubmit="fazerRegistro(event)">
      <label>Nome da empresa</label>
      <input type="text" id="reg-nome" required>
      <label>E-mail</label>
      <input type="email" id="reg-email" required>
      <label>Senha (mínimo 6 caracteres)</label>
      <input type="password" id="reg-senha" required minlength="6">
      <button class="submit" type="submit">Criar conta</button>
    </form>

    <div class="msg" id="msg"></div>
  </div>

<script>
function mudarAba(qual){
  document.getElementById('tab-login').classList.toggle('active', qual==='login');
  document.getElementById('tab-registrar').classList.toggle('active', qual==='registrar');
  document.getElementById('form-login').classList.toggle('active', qual==='login');
  document.getElementById('form-registrar').classList.toggle('active', qual==='registrar');
  esconderMsg();
}
function mostrarMsg(texto, tipo){
  const el = document.getElementById('msg');
  el.textContent = texto;
  el.className = 'msg ' + tipo;
}
function esconderMsg(){
  document.getElementById('msg').className = 'msg';
}
async function fazerLogin(ev){
  ev.preventDefault();
  esconderMsg();
  try{
    const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({
      email: document.getElementById('login-email').value,
      senha: document.getElementById('login-senha').value,
    })});
    const j = await r.json();
    if(j.sucesso){ window.location.href = '/painel'; }
    else { mostrarMsg(j.mensagem || 'Erro ao entrar', 'erro'); }
  }catch(e){ mostrarMsg('Erro de conexão: ' + e.message, 'erro'); }
}
async function fazerRegistro(ev){
  ev.preventDefault();
  esconderMsg();
  try{
    const r = await fetch('/api/registrar', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({
      nome: document.getElementById('reg-nome').value,
      email: document.getElementById('reg-email').value,
      senha: document.getElementById('reg-senha').value,
    })});
    const j = await r.json();
    if(j.sucesso){ window.location.href = '/painel'; }
    else { mostrarMsg(j.mensagem || 'Erro ao cadastrar', 'erro'); }
  }catch(e){ mostrarMsg('Erro de conexão: ' + e.message, 'erro'); }
}
</script>
</body>
</html>
