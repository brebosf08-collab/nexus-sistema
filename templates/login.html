<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus — Autenticação de Segurança</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}?v=nexus-v2">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --accent: {% if tipo == 'cliente' %}#10b981{% else %}#6366f1{% endif %};
      --accent-glow: rgba({% if tipo == 'cliente' %}16, 185, 129{% else %}99, 102, 241{% endif %}, 0.15);
      --bg: #030305;
    }

    body {
      background: var(--bg);
      color: #fff;
      font-family: 'Inter', sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      overflow: hidden;
    }

    /* ── BACKGROUND PORTAL ── */
    .bg-portal { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .bg-grid {
      position: absolute; inset: 0;
      background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      mask-image: radial-gradient(circle at 50% 50%, black, transparent 80%);
    }
    .glow-orb {
      position: absolute; border-radius: 50%; filter: blur(140px);
      background: var(--accent); opacity: 0.15; animation: float 20s infinite alternate ease-in-out;
    }

    @keyframes float { 
      0% { transform: translate(-10%, -10%) scale(1); }
      100% { transform: translate(10%, 10%) scale(1.2); }
    }

    /* ── LOGIN CARD ── */
    .card-nexus {
      position: relative; z-index: 10;
      width: 100%; max-width: 480px;
      background: rgba(255, 255, 255, 0.01);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 48px; padding: 4.5rem 3.5rem;
      backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
      box-shadow: 0 60px 120px -30px rgba(0,0,0,0.9);
      animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
      text-align: center;
    }

    .card-icon {
      width: 80px; height: 80px; border-radius: 24px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 2rem; background: var(--accent-glow); color: var(--accent);
      border: 1px solid rgba(255,255,255,0.04); margin-bottom: 2.5rem;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif; font-size: 2.75rem; font-weight: 800;
      margin: 0; letter-spacing: -0.05em; line-height: 1.1;
    }
    .subtitle { color: #808090; font-size: 1.1rem; margin-top: 1rem; margin-bottom: 3.5rem; }

    .field { display: flex; flex-direction: column; gap: 12px; text-align: left; margin-bottom: 1.5rem; }
    label { font-size: 0.75rem; font-weight: 800; color: #606070; text-transform: uppercase; letter-spacing: 0.1em; }
    
    input {
      background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px; height: 60px; padding: 0 1.5rem; color: #fff;
      font-size: 1.05rem; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: inherit;
    }
    input:focus {
      outline: none; border-color: var(--accent);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 0 5px var(--accent-glow);
    }

    .btn-submit {
      width: 100%; height: 68px; border: none; border-radius: 22px;
      background: var(--accent); color: #fff; font-size: 1.15rem; font-weight: 800;
      cursor: pointer; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex; align-items: center; justify-content: center; gap: 15px;
      margin-top: 1rem; box-shadow: 0 20px 40px -10px var(--accent-glow);
    }
    .btn-submit:hover { transform: translateY(-4px); box-shadow: 0 30px 60px -10px var(--accent-glow); opacity: 0.95; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .footer-portal { text-align: center; margin-top: 3rem; color: #606070; font-size: 0.95rem; }
    .footer-portal a { color: #fff; font-weight: 700; text-decoration: none; border-bottom: 2px solid var(--accent); transition: 0.3s; }
    .footer-portal a:hover { color: var(--accent); }

    .error-msg {
      display: none; background: rgba(244, 63, 94, 0.08); border: 1px solid rgba(244, 63, 94, 0.15);
      color: #f43f5e; padding: 1.25rem; border-radius: 18px; margin-top: 2rem; font-weight: 600;
      animation: shake 0.4s ease-in-out;
    }

    .input-wrapper { position: relative; display: flex; align-items: center; }
    .input-wrapper input { width: 100%; padding-right: 3.5rem; }
    .btn-toggle {
      position: absolute; right: 10px; height: 40px; width: 40px;
      background: transparent; border: none; color: #606070;
      cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center;
      transition: 0.3s;
    }
    .btn-toggle:hover { color: var(--accent); }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  </style>
</head>
<body>

<div class="bg-portal">
  <div class="bg-grid"></div>
  <div class="glow-orb" style="width: 600px; height: 600px; top: -150px; left: 50%; transform: translateX(-50%);"></div>
</div>

<div class="card-nexus">
  <div class="card-icon"><i class="fas fa-shield-halved"></i></div>
  <h1>Nexus Access</h1>
  <p class="subtitle">Insira suas credenciais de acesso</p>

  <form id="formLogin">
    <div class="field">
      <label>E-mail Corporativo</label>
      <input type="email" name="email" placeholder="nome@empresa.com" required autofocus>
    </div>
    <div class="field">
      <label>Chave de Acesso</label>
      <div class="input-wrapper">
        <input type="password" id="senha" name="senha" placeholder="••••••••" required>
        <button type="button" class="btn-toggle" onclick="togglePass('senha', this)">
          <i class="fas fa-eye"></i>
        </button>
      </div>
    </div>
    
    <button type="submit" class="btn-submit" id="btnSubmit">
      <span>Autenticar Agora</span>
      <i class="fas fa-chevron-right"></i>
    </button>
    
    <div id="errorMsg" class="error-msg"></div>
  </form>

  <div class="footer-portal">
    Ainda não possui credenciais? <a href="/">Iniciar Credenciamento</a>
  </div>
</div>

<script>
  // Auth agora é feito pelo backend Flask

  document.getElementById('formLogin').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnSubmit');
    const err = document.getElementById('errorMsg');
    err.style.display = 'none';
    btn.disabled = true;
    btn.querySelector('span').textContent = 'Validando Acesso...';
    btn.querySelector('i').className = 'fas fa-circle-notch fa-spin';

    const fd = new FormData(e.target);
    const data = Object.fromEntries(fd);

    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ login: data.email, senha: data.senha })
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.mensagem || 'Erro ao autenticar');
      window.location.href = j.redirect;
    } catch (ex) {
      err.textContent = "Erro de Acesso: " + (ex.message || "Verifique suas credenciais.");
      err.style.display = 'block';
      btn.disabled = false;
      btn.querySelector('span').textContent = 'Autenticar Agora';
      btn.querySelector('i').className = 'fas fa-chevron-right';
    }
  });
  function togglePass(id, btn) {
    const input = document.getElementById(id);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
      input.type = 'text';
      icon.className = 'fas fa-eye-slash';
    } else {
      input.type = 'password';
      icon.className = 'fas fa-eye';
    }
  }
</script>

</body>
</html>
